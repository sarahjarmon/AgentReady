[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentready"
version = "0.2.0"
description = "Auditeur explicable de la découvrabilité IA d'un site public"
requires-python = ">=3.9"

[project.scripts]
agentready = "agentready.cli:main"

[project.optional-dependencies]
headless = ["playwright>=1.40,<2"]

[tool.setuptools.packages.find]
include = ["agentready*"]
